apiVersion: optimizer.cluster.io/v1alpha1
kind: OptimizerConfig
metadata:
  name: workloads-optimizer
  namespace: intelligent-optimizer-system
spec:
  # Target the workloads namespace where test applications run
  targetNamespaces:
    - workloads

  # Start in dry-run — observe recommendations before applying
  # Set to false once you have verified the recommendations look sane
  dryRun: true

  strategy: aggressive
