apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - workloads-namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - optimizerconfig-workloads.yaml

images:
  - name: us-central1-docker.pkg.dev/k8s-resource-optimizer/optimizer/controller
    newTag: latest

commonLabels:
  app.kubernetes.io/part-of: intelligent-cluster-optimizer
  app.kubernetes.io/managed-by: kustomize
